name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: backend · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run tests
        working-directory: backend
        run: python -m unittest discover -s tests -t tests -v

  frontend:
    name: frontend · tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Run tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Committed bundle matches source
        # frontend/dist is committed so the app runs without Node; fail if it is stale.
        # Source maps are skipped: they embed the build machine's file paths.
        run: git diff --exit-code --stat -- frontend/dist ':(exclude)*.map'

  smoke:
    name: app starts and serves the UI
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Start app, log in, list items
        shell: bash
        run: python .github/smoke_run.py
